# 内网共享知识库：单节点 Elasticsearch 8.19.23（security + TLS + IK 分词）
# 部署机 192.168.1.125，目录 /docker/dsh-es，容器名 dsh-es。
#
# 与另外两套的差异（只三处，其余刻意保持一致，便于对拍）：
#  1. **端口只绑 192.168.1.125**（内网网卡 enp6s0）：整个局域网（含各成员机的 DSH 容器，
#     走宿主 IP）都能访问，但 wg0(10.9.0.10) 那侧不暴露 —— VPN 对端不全是内网成员。
#  2. **证书 SAN 带内网 IP 与主机名**：客户端用 https://192.168.1.125:9200、
#     https://es-host.local:9200、https://dsh-es:9200 都能通过 hostname 校验。
#     旧的 es-remote 只签了 127.0.0.1，所以除宿主机外谁都连不上。
#  3. 存储与编排独立在 /docker/dsh-es（data/certs/plugins/snapshots 都是相对路径下的绑定挂载）。
#
# 客户端连接需要 CA：certs/ca.crt（分发给各机器，配 NODE_EXTRA_CA_CERTS 或 --cacert）。
services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    container_name: dsh-es
    restart: unless-stopped
    environment:
      - node.name=dsh-es
      - cluster.name=dsh-memory-es
      - discovery.type=single-node          # 单节点：索引 replicas 必须为 0
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false   # 关掉自动 enrollment，避免 token 干扰
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.keystore.path=certs/elastic-certificates.p12
      - xpack.security.http.ssl.keystore.password=${CERT_PASS:-changeme}
      - xpack.security.http.ssl.truststore.path=certs/elastic-certificates.p12
      - xpack.security.http.ssl.truststore.password=${CERT_PASS:-changeme}
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.keystore.path=certs/elastic-certificates.p12
      - xpack.security.transport.ssl.keystore.password=${CERT_PASS:-changeme}
      - xpack.security.transport.ssl.truststore.path=certs/elastic-certificates.p12
      - xpack.security.transport.ssl.truststore.password=${CERT_PASS:-changeme}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?需要 /docker/dsh-es/.env 里的 ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - path.repo=/usr/share/elasticsearch/snapshots   # snapshot 仓库根目录（fs repo 必须在其下）
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    # 宿主 94 GiB、现有负载约 16 GiB，4g 上限 = heap 2g + 堆外约 1g + page cache 1g。
    # 作为全内网知识库，数据量级仍在百 MB，够用；要扩先改 ES_JAVA_OPTS 再同步上限。
    mem_limit: 4g
    volumes:
      - ./data:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs
      - ./plugins/analysis-ik:/usr/share/elasticsearch/plugins/analysis-ik
      - ./snapshots:/usr/share/elasticsearch/snapshots
    ports:
      - "192.168.1.125:9200:9200"   # 只绑内网网卡：局域网可达，wg0(10.9.0.10) 不暴露
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk -u elastic:$$ELASTIC_PASSWORD https://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
