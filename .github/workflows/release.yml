name: Release

# 打 tag（v0.2.0 这种）即发布：在 Actions 里构建发行包并作为 Release 附件上传。
# 这样发布不需要本地机器参与，也不需要仓库 owner 手工上传。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: |
          # npm 10 解析这些 `*` 形式的 peerDependencies 的 arborist 会崩
          # （Cannot read properties of null (reading 'children')），跳过 peer 解算。
          npm ci --legacy-peer-deps
          # 用全局布局装一份 dsh 再软链进来（与 ci.yml 同因，详见那里）：
          # 四个孤立 peer 缺事件表、平铺装又会让 dsh-tools 的兄弟包找不到。
          # 版本必须与运行宿主一致。
          npm install -g --prefix "$PWD/vendor-global" --no-audit --no-fund \
            @deepseek-ai/dsh@0.2.1-rc.3
          DSH_HOST_PKGS="$PWD/vendor-global/lib/node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai" \
            bash scripts/link-deps.sh

      - name: 质量闸门（类型 + 单测）
        run: |
          # 之前只在本地手工跑，结果 typecheck 红了 3 个版本没人发现（2026-11-02 评审）。
          # 发版前必须过这道闸；集成测试需要本机 ES，这里会 skip（文案会打印缺哪个键）。
          npm run typecheck
          npm test

      - name: 构建并打包
        run: |
          # 不走 scripts/build.sh：它的第二步 link-deps 要把宿主 dsh 的
          # node_modules 链进来，CI 里没有宿主、必然失败。宿主包已在
          # 「安装依赖」整装一份，直接 tsdown + 打包即可。
          npx tsdown
          bash scripts/package.sh

      - name: 校验包
        run: |
          cd dist
          tar tzf ./*.tar.gz >/dev/null
          sha256sum -c ./*.tar.gz.sha256

      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## dsh-memory-es ${{ github.ref_name }}

            DSH（DeepSeek Harness）的记忆插件：Elasticsearch 存储与检索，
            个人记忆库 + 团队知识库双层隔离。

            ### 安装

            ```bash
            tar xzf dsh-memory-es-*.tar.gz
            cd dsh-memory-es-*
            ./install.sh                        # 本机：DSH_HOME=~/.dsh，profile=web
            ./install.sh --dsh-home /data/dsh   # dsh 跑在容器里时（root 执行再加 --owner node）
            ```

            装完重启 dsh web。核对版本：插件日志 `ready: v…`、面板自检 `自检通过 v…`、
            面板页脚「版本 …」。

            ### 校验

            ```bash
            sha256sum -c dsh-memory-es-*.tar.gz.sha256
            ```
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
