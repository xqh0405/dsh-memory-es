name: CI

# 每次 push / PR 都过类型与单测：这把闸之前不存在，typecheck 因此红了三个版本
# （v0.6.12 → v0.6.14，2026-11-02 评审发现）。发版流程在 release.yml，这里是日常闸门。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: |
          # 同 release.yml：npm 10 解析 `*` 形式的 peerDependencies 会崩，跳过 peer 解算。
          npm ci --legacy-peer-deps
          # 类型检查要的是**拼齐事件表**的包环境，而不是四个孤立包：
          # cordis 的 Events 接口靠各子包 `declare module` 拼出来
          # （例如 `agent/inbox/inserted` 来自 dsh-agent），只装 cordis / dsh-tools
          # 会在 `ctx.on(...)` 处报 TS2345，看着像插件代码写错，其实是环境缺料。
          # 所以整装一份 dsh——它自带全部子包，npm 会平铺到 node_modules。
          # 版本必须与运行时宿主一致（见 scripts/link-deps.sh 的注释）。
          npm install --no-save --legacy-peer-deps @deepseek-ai/dsh@0.2.1-rc.3

      - name: 类型检查
        run: npm run typecheck

      - name: 单测
        run: npm test
