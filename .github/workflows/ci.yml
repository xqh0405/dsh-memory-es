name: CI

# 每次 push / PR 都过类型与单测：这把闸之前不存在，typecheck 因此红了三个版本
# （v0.6.12 → v0.6.14，2026-11-02 评审发现）。发版流程在 release.yml，这里是日常闸门。
on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：想单独跑一次这道闸时不用空推一个 commit
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: |
          # 同 release.yml：npm 10 解析 `*` 形式的 peerDependencies 会崩，跳过 peer 解算。
          npm ci --legacy-peer-deps
          # 插件跑在宿主里，类型与运行时都依赖宿主的 @deepseek-ai/*。
          # 这里用**全局布局**装一份 dsh 再软链进去（scripts/link-deps.sh 就是为
          # 「宿主的 node_modules/@deepseek-ai 整个目录」写的），原因有两条：
          #  · 四个孤立 peer 不够：cordis 的 Events 靠各子包 declare module 拼出来
          #    （`agent/inbox/inserted` 来自 dsh-agent），缺了报 TS2345；
          #  · 平铺装到本项目 node_modules 也不够：dsh-tools 运行时 import 了
          #    dsh-scope / dsh-sandbox / dsh-llm，却没写进自己的 dependencies，
          #    依赖被摊平到别处后单测会成片 ERR_MODULE_NOT_FOUND。
          # 全局布局的目录结构与真实安装一致，兄弟包互相找得到。
          npm install -g --prefix "$PWD/vendor-global" --no-audit --no-fund \
            @deepseek-ai/dsh@0.2.1-rc.3
          DSH_HOST_PKGS="$PWD/vendor-global/lib/node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai" \
            bash scripts/link-deps.sh

      - name: 类型检查
        run: npm run typecheck

      - name: 单测
        run: npm test

      # 契约闸门·离线层：不连 ES，只校验契约文件与基线有没有腐化
      # （语法错 / id 重复 / 恒真契约 / must 被降级 / 基线漂移）。
      # 真实召回质量仍是 `npm run eval:contracts:gate`，它按 memory_id 命中真实记忆，
      # 只能在能连 ES 的内网环境跑——这台 runner 没有索引，也不该有。
      - name: 契约静态闸
        run: npm run check:contracts

      # 索引字段对拍（2026-11-10 审查 M11/#19 接入）：不连 ES，只读仓库里的
      # scripts/init-indices.sh 两份模板，比对团队库两个写入方的必需字段
      # （promote-team.ts 的 doc + search.ts 的 HIT_UPDATE_SCRIPT）。
      # #17「团队模板缺 activation、新装机命中回写必 400」之所以一路溜过去，
      # 就是因为这道闸当时只在本地手动跑、从没进流水线 —— 现在缺字段、或 REQUIRED
      # 与代码 drift，都会让本步 exit 1。
      # 需要 python3（ubuntu-latest 自带）与 bash，不需要 ES 与凭据。
      - name: 索引字段对拍
        run: bash scripts/diff-index-fields.sh
